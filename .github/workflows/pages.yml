name: Deploy AGM Review Studio (GitHub Pages)

# Publishes docs/studio/dist to https://github.com/abx-git/agm.github.io
# Live URL: https://abx-git.github.io/agm.github.io/

on:
  push:
    branches: [main]
    paths:
      - 'docs/studio/**'
      - 'docs/assistant/**'
      - 'prompts/adopt-standalone.md'
      - 'prompts/workflows/**'
      - 'scripts/sync-assistant-data.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: deploy-agm-github-io
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy key + SSH preflight
        id: ssh
        env:
          ACTIONS_DEPLOY_KEY: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_DEPLOY_KEY:-}" ]; then
            echo "::error::Missing secret ACTIONS_DEPLOY_KEY on abx-git/agm. See docs/studio/GITHUB-PAGES-SETUP.md"
            exit 1
          fi

          python3 <<'PY'
          import os
          from pathlib import Path

          raw = os.environ["ACTIONS_DEPLOY_KEY"].strip()
          # GitHub UI / some tools store real newlines as the two-char sequence \n
          if "BEGIN" in raw and raw.count("\n") < 3 and "\\n" in raw:
              raw = raw.replace("\\n", "\n")
          raw = raw.replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          if "BEGIN" not in raw or "PRIVATE KEY" not in raw:
              raise SystemExit(
                  "::error::ACTIONS_DEPLOY_KEY does not look like a private key "
                  "(expected -----BEGIN … PRIVATE KEY-----). You pasted the .pub file, or the secret is truncated."
              )
          path = Path(os.environ["RUNNER_TEMP"]) / "agm_pages_deploy_key"
          path.write_text(raw)
          path.chmod(0o600)
          print(f"Wrote deploy key ({path.stat().st_size} bytes)")
          PY

          KEY="${RUNNER_TEMP}/agm_pages_deploy_key"
          echo "DEPLOY_KEY_PATH=$KEY" >> "$GITHUB_ENV"

          echo "Public key derived from secret (must match Deploy Key on agm.github.io):"
          ssh-keygen -y -f "$KEY" | tee "${RUNNER_TEMP}/agm_pages_deploy_key.pub"
          echo "Fingerprint:"
          ssh-keygen -lf "${RUNNER_TEMP}/agm_pages_deploy_key.pub"

          eval "$(ssh-agent -s)"
          ssh-add "$KEY"
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          set +e
          SSH_OUT=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -T git@github.com 2>&1)
          set -e
          echo "$SSH_OUT"
          if ! echo "$SSH_OUT" | grep -qi "successfully authenticated"; then
            echo "::error::SSH to github.com failed (publickey)."
            exit 1
          fi

          git ls-remote git@github.com:abx-git/agm.github.io.git HEAD
          echo "SSH preflight OK."

      - name: Ensure GitHub Pages is enabled on agm.github.io
        env:
          AGM_GHIO_DEPLOY: ${{ secrets.AGM_GHIO_DEPLOY }}
          BLUEPRINT_PATTERN_GHIO_DEPLOY: ${{ secrets.BLUEPRINT_PATTERN_GHIO_DEPLOY }}
        run: |
          set -euo pipefail
          TOKEN="${AGM_GHIO_DEPLOY:-${BLUEPRINT_PATTERN_GHIO_DEPLOY:-}}"
          if [ -z "$TOKEN" ]; then
            echo "::notice::No AGM_GHIO_DEPLOY — skipping Pages API. Ensure Pages is on (main / /)."
            exit 0
          fi
          echo "::add-mask::$TOKEN"
          API="https://api.github.com/repos/abx-git/agm.github.io/pages"
          STATUS=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API")
          if [ "$STATUS" = "200" ]; then
            echo "GitHub Pages already enabled."
            cat /tmp/pages.json
            exit 0
          fi
          if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
            echo "::warning::Pages API auth failed (HTTP $STATUS). Enable Pages manually if needed."
            cat /tmp/pages.json || true
            exit 0
          fi
          if [ "$STATUS" != "404" ]; then
            echo "::error::Unexpected Pages API status $STATUS"
            cat /tmp/pages.json
            exit 1
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          echo "GitHub Pages enabled."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/studio/package-lock.json

      - name: Sync workflow prompts into assistant + studio data
        run: python3 scripts/sync-assistant-data.py

      - name: Build Review Studio
        run: |
          set -euo pipefail
          cd docs/studio
          npm ci
          npm run build

      - name: Deploy docs/studio/dist to agm.github.io
        run: |
          set -euo pipefail
          KEY="${DEPLOY_KEY_PATH}"
          eval "$(ssh-agent -s)"
          ssh-add "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          SITE="${RUNNER_TEMP}/agm.github.io"
          rm -rf "$SITE"
          git clone --depth 1 git@github.com:abx-git/agm.github.io.git "$SITE"

          find "$SITE" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a docs/studio/dist/ "$SITE/"

          touch "$SITE/.nojekyll"

          mkdir -p "$SITE/legacy-assistant"
          cat > "$SITE/legacy-assistant/index.html" <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta http-equiv="refresh" content="0;url=../" />
            <title>Moved to AGM Review Studio</title>
          </head>
          <body>
            <p>The AGM Assistant is now part of <a href="../">AGM Review Studio</a> (Workflows tab).</p>
          </body>
          </html>
          HTML

          cd "$SITE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes — nothing to push."
          else
            git commit -m "Deploy AGM Review Studio from agm@${GITHUB_SHA:0:7}"
            git push origin main
            echo "Pushed to abx-git/agm.github.io main."
          fi

          echo "Expected live URL: https://abx-git.github.io/agm.github.io/"
          echo "Pages must be: Deploy from a branch → main → / (root) on abx-git/agm.github.io."
          echo "This workflow does not create entries under abx-git/agm/deployments — check Actions here and Pages on agm.github.io."

          # Wait for github-pages environment deploy on agm.github.io (separate from this push).
          # A green push here with a failed pages-build-deployment leaves the live site on the last good publish.
          echo "Waiting for pages-build-deployment on abx-git/agm.github.io…"
          SITE_SHA="$(git -C "$SITE" rev-parse HEAD)"
          DEPLOY_OK=0
          for i in $(seq 1 36); do
            sleep 10
            DEP_JSON=$(curl -sS -H "Accept: application/vnd.github+json" -H "User-Agent: agm-pages-ci" \
              "https://api.github.com/repos/abx-git/agm.github.io/deployments?sha=${SITE_SHA}&environment=github-pages&per_page=1" || true)
            DEP_ID=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d[0]["id"] if isinstance(d,list) and d else "")' "$DEP_JSON" 2>/dev/null || true)
            if [ -z "$DEP_ID" ]; then
              echo "  [$i] no deployment yet for $SITE_SHA"
              continue
            fi
            ST_JSON=$(curl -sS -H "Accept: application/vnd.github+json" -H "User-Agent: agm-pages-ci" \
              "https://api.github.com/repos/abx-git/agm.github.io/deployments/${DEP_ID}/statuses?per_page=5" || true)
            STATE=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d[0]["state"] if isinstance(d,list) and d else "")' "$ST_JSON" 2>/dev/null || true)
            echo "  [$i] deployment $DEP_ID state=$STATE"
            if [ "$STATE" = "success" ]; then
              DEPLOY_OK=1
              break
            fi
            if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
              echo "::error::pages-build-deployment failed on agm.github.io (state=$STATE). Open https://github.com/abx-git/agm.github.io/actions/workflows/pages-build-deployment.yml and Re-run. Live site stays on the last successful publish until that is green."
              exit 1
            fi
          done
          if [ "$DEPLOY_OK" != "1" ]; then
            echo "::error::Timed out waiting for github-pages deploy of ${SITE_SHA}. Check https://github.com/abx-git/agm.github.io/actions/workflows/pages-build-deployment.yml"
            exit 1
          fi

          CODE=$(curl -s -o /tmp/pages-body.txt -w "%{http_code}" "https://abx-git.github.io/agm.github.io/" || true)
          LIVE_JS=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' /tmp/pages-body.txt 2>/dev/null | head -1 || true)
          RAW_JS=$(curl -sS "https://raw.githubusercontent.com/abx-git/agm.github.io/main/index.html" | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1 || true)
          echo "HTTP $CODE live_js=$LIVE_JS raw_js=$RAW_JS"
          if [ "$CODE" != "200" ]; then
            echo "::error::Live site HTTP $CODE after successful Pages deploy status."
            exit 1
          fi
          if [ -n "$RAW_JS" ] && [ -n "$LIVE_JS" ] && [ "$RAW_JS" != "$LIVE_JS" ]; then
            echo "::warning::Live CDN still serving $LIVE_JS while main has $RAW_JS (cache lag). Hard-refresh in a minute."
          else
            echo "Live site OK and in sync with main."
          fi
